[package]
name = "genshin-mora-reader"
version = "0.1.0"
edition = "2024"
description = "Passively reads Genshin Impact game traffic and records every Mora gain (and what caused it)"
license = "MIT"

[dependencies]
anyhow = "1.0"
# Vendored from https://github.com/konkers/auto-artifactarium (rev abbbf7a)
# with GenshinReader patches: debounced handshake resets and KCP conversation
# re-adoption after relogin/account switches. See vendor/auto-artifactarium.
auto-artifactarium = { path = "vendor/auto-artifactarium" }
arboard = "3"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
eframe = "0.32"
egui_extras = "0.32"
futures = "0.3"
protobuf = "3.7"
pktmon = { version = "0.6.2", features = ["tokio"] }
rand_mt = "4.2"
rsa = { version = "0.9", features = ["sha1", "sha2"] }
sha1 = "0.10"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 2
